name: Crawl daily news

on:
  schedule:
    # UTC 0:00 ≈ 北京 08:00（GitHub cron 不保证准时，可能延迟数分钟~数十分钟）
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run crawler
        run: node scripts/crawl-ai-bot.mjs
      - name: Commit & push if new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily
          if git diff --staged --quiet; then
            echo "no new entries, skip"
          else
            git commit -m "content: daily $(date +%F)"
            git push
          fi
